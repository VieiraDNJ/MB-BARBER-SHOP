<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Equipe | MB Barber Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #1c1c1e; color: white; }
    .navbar { background-color: #3b3a3d; border-bottom: 2px solid #f17a12; }
    .card-block { background-color: #2c2c2e; border: 1px solid #444; border-radius: 15px; padding: 25px; margin-top: 20px; }
    .btn-ativo { background-color: #198754; color: white; }
    .btn-inativo { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">Gerenciar Equipe</span>
      <a href="admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- Formulário de Cadastro -->
    <div class="card-block mb-4">
        <h5>Adicionar Novo Usuário</h5>
        <br>
        <form id="formCadastro" class="row g-3">
            <label>Nome Completo</label><div class="col-12"><input type="text" id="nome" class="form-control" placeholder=" " required autocomplete="off"></div>
          <label>CPF</label>
            <div class="col-12">
                <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" 
                    maxlength="14" oninput="mascaraCPF(this)" autocomplete="off">
            </div>
            <label>Data de Nascimento</label><div class="col-12">
                <input type="text" id="data_nascimento" class="form-control" 
                    placeholder="DD/MM/AAAA" maxlength="10" 
                    oninput="mascaraData(this)" required autocomplete="off">
            </div>
            <label>E-mail</label><div class="col-12"><input type="email" id="email" class="form-control" placeholder=" " required autocomplete="off"></div>
            <label>Telefone</label><div class="col-12"><input type="text" id="telefone" class="form-control" placeholder=" " autocomplete="off"></div>
            <label>Selecione o Cargo</label><div class="col-12">
                <select id="cargo" class="form-select">
                    <option value="Barbeiro">Barbeiro</option>
                    <option value="Admin">Administrador</option>
                </select>
            </div>
            <label>Senha</label><div class="col-12"><input type="password" id="senha" class="form-control" placeholder=" " required autocomplete="off"></div>
            <div class="col-12"><button type="submit" class="btn btn-primary w-100">Cadastrar</button></div>
        </form>
    </div>

    <!-- Lista de Membros -->
    <div class="card-block">
        <h5>Membros da Equipe</h5>
        <table class="table table-dark table-hover mt-3">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cargo</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaEquipe"></tbody>
        </table>
    </div>
  </div>

<script src="../JS/equipe.js"></script>
</body>
</html>
