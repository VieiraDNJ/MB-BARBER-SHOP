<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Logs | MB Barber Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #1c1c1e; color: white; }
    .navbar { background-color: #3b3a3d; border-bottom: 2px solid #f17a12; }
    .card-block { background-color: #2c2c2e; border: 1px solid #444; border-radius: 15px; padding: 25px; margin-top: 20px; }
    .table { color: white; }
    .table thead { color: #f17a12; } /* Cor do detalhe (laranja) no cabeçalho da tabela */
    .btn-warning { background-color: #f17a12; border: none; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Navbar idêntica ao seu padrão -->
  <nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">Registro de Atividades (Logs)</span>
      <a href="admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- Card de Conteúdo -->
    <div class="card-block">
        <div class="d-flex justify-content-between align-items-center">
            <h5>Histórico de Ações</h5>
            <button class="btn btn-warning btn-sm" onclick="carregarLogs()">
                <i class="bi bi-arrow-clockwise"></i> Atualizar
            </button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-dark table-hover mt-3">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Ação Realizada</th>
                    </tr>
                </thead>
                <tbody id="lista-logs">
                    <!-- Logs carregados via JS -->
                </tbody>
            </table>
        </div>
    </div>
  </div>

<script>
  const API_BASE_URL = `http://${window.location.hostname}:3000`;

  async function carregarLogs() {
    const tbody = document.getElementById('lista-logs');
    try {
        const response = await fetch(`${API_BASE_URL}/admin/logs`);
        const logs = await response.json();
        
        // Agora o log.data_formatada já vem formatado pelo SQL: "16/07/2026 10:30"
        tbody.innerHTML = logs.map(log => {
            return `
                <tr>
                    <td style="color: #f17a12;">${log.data_formatada}</td>
                    <td>${log.admin_usuario}</td>
                    <td>
                        <strong>${log.acao}</strong><br>
                        <small class="text-secondary">${log.detalhes || ''}</small>
                    </td>
                </tr>
            `;
        }).join('');
    } catch (error) {
        console.error("Erro ao carregar logs:", error);
    }
  }

  window.onload = carregarLogs;
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
