<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Agenda | MB Barber Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #1c1c1e; color: white; }
    .navbar { background-color: #3b3a3d; border-bottom: 2px solid #f17a12; }
    .card-block { background-color: #2c2c2e; border: 1px solid #444; border-radius: 15px; padding: 25px; margin-top: 20px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">Bloqueio de Horários</span>
      <a href="admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card-block">
      <h5>Novo Bloqueio</h5>
      <form id="formBloqueio" class="row g-3">
        <div class="col-md-3">
            <label class="form-label">Barbeiro</label>
            <select id="bloqueioBarbeiro" class="form-select" required><option value="">Selecione...</option></select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Data</label>
            <input type="date" id="bloqueioData" class="form-control" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">De:</label>
            <select id="horarioInicio" class="form-select">
                <option value="09:00">09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option>
                <option value="13:00">13:00</option><option value="14:00">14:00</option><option value="15:00">15:00</option>
                <option value="16:00">16:00</option><option value="17:00">17:00</option><option value="18:00">18:00</option>
                <option value="19:00">19:00</option><option value="20:00">20:00</option><option value="21:00">21:00</option>
                <option value="22:00">22:00</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">Até:</label>
            <select id="horarioFim" class="form-select">
                <option value="09:00">09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option>
                <option value="13:00">13:00</option><option value="14:00">14:00</option><option value="15:00">15:00</option>
                <option value="16:00">16:00</option><option value="17:00">17:00</option><option value="18:00">18:00</option>
                <option value="19:00">19:00</option><option value="20:00">20:00</option><option value="21:00">21:00</option>
                <option value="22:00" selected>22:00</option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-danger w-100">Bloquear</button>
        </div>
      </form>
    </div>

    <div class="card-block">
        <h5>Bloqueios Ativos</h5>
        <table class="table table-dark table-hover mt-3">
            <thead><tr><th>Barbeiro</th><th>Data</th><th>Horário</th><th>Ação</th></tr></thead>
            <tbody id="tabelaBloqueios"></tbody>
        </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- CHAMADA ÚNICA DO ARQUIVO JS -->
  <script src="../JS/admin_agenda.js"></script>
</body>
</html>
