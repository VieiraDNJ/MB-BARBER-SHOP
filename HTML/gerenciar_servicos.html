<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Serviços | MB Barber Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../CSS/gerenciar_servicos.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark p-3">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">
                Gerenciar Serviços
            </span>

            <a href="admin.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i>
                Voltar
            </a>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container mt-4">

        <!-- Card -->
        <div class="card-block">

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5>Serviços Cadastrados</h5>
                    <p class="text-secondary mb-0">
                        Consulte os serviços e altere seus preços.
                    </p>
                </div>

                <button class="btn btn-warning btn-sm" onclick="carregarServicos()">
                    <i class="bi bi-arrow-clockwise"></i>
                    Atualizar
                </button>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <div class="table-responsive">
                <table class="table table-dark table-hover mt-3">
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Preço</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaServicos">
                        <tr>
                            <td colspan="3" class="text-center">
                                Carregando serviços...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Modal de edição -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarLabel">
                        Editar Serviço
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Fechar">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label for="nomeServico" class="form-label">
                            Serviço
                        </label>

                        <input type="text"
                               id="nomeServico"
                               class="form-control"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label for="precoServico" class="form-label">
                            Preço
                        </label>

                        <input type="number"
                               id="precoServico"
                               class="form-control"
                               min="0"
                               step="0.01"
                               placeholder="Ex.: 30.00">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button"
                            class="btn btn-warning"
                            onclick="salvarServico()">
                        <i class="bi bi-check-lg"></i>
                        Salvar Alterações
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="../JS/gerenciar_servicos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
