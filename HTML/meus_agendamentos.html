<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agendamentos | MB Barber Shop</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #3b3a3d;
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }
        .header-title {
            color: #f17a12;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .text-muted{
            color: #f17a12 !important;
        }
        .card-custom {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }
        .table {
            color: #ddd;
            vertical-align: middle;
            text-align: center;
        }
        .table thead {
            background-color: #252525;
            color: #f17a12;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-cancel {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            transition: 0.3s;
        }
        .btn-cancel:hover {
            background-color: #ff4d4d;
            color: white;
        }
        .empty-state {
            padding: 40px;
            text-align: center;
        }
        .empty-state ion-icon {
            font-size: 60px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="header-title mb-0">Meus Agendamentos</h2>
                <p class="text-muted small">Gerencie seus horários com a MB Barber Shop</p>
            </div>
            <a href="index.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center" style="color: #fff; border-color: #555;">
                <ion-icon name="arrow-back-outline" class="me-2"></ion-icon> Voltar
            </a>
        </div>

        <div class="card-custom shadow-lg">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Data</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Horário</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Serviço</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Barbeiro</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Valor</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Status</th>
                            <th style="padding: 15px; border-bottom: 2px solid #333;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaAgendamentosCliente">
                        </tbody>
                </table>
            </div>
            
            <div id="vazio" class="empty-state d-none">
                <ion-icon name="calendar-outline"></ion-icon>
                <p class="mt-3" style="color: #aaa;">Você ainda não possui agendamentos ativos.</p>
                <a href="agendamento.html" class="btn btn-primary btn-sm" style="background-color: #f17a12; border: none;">Agendar Agora</a>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../JS/atendimentos.js"></script>
</body>
</html>
