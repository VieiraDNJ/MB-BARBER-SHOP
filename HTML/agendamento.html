<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | MB Barber Shop</title>
  <link rel="stylesheet" href="../CSS/agendamentos.css">
  <link rel="stylesheet" href="../CSS/auth.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
        .navbar {
            min-height: 110px;
        }

        @media (max-width: 991px) {
            .navbar-collapse {
                background-color: #3b3a3d;
                padding-bottom: 20px;
                text-align: center;
            }

            /* Estilo para o container ficar embaixo de tudo no mobile */
            #auth-container {
                width: 100%;
                display: flex;
                justify-content: center;
                padding: 20px 0;
                border-top: 1px solid rgba(255,255,255,0.1); /* Linha divisória após Contatos */
                margin-top: 10px;
            }
            
            /* Garante que o dropdown não quebre o layout centralizado */
            #auth-container .dropdown-menu {
                position: static !important;
                float: none;
                width: 100%;
                background: transparent;
                border: none;
                text-align: center;
            }
        }
  </style>
</head>

<body>

  <nav style="background-color: #3b3a3d;" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../HTML/index.html">
        <img src="../IMAGEM/Logo MB Barber Shop.png" width="140" height="110" alt="Logo">
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">
          <li class="nav-item">
            <a class="nav-link active" href="../HTML/index.html">Menu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../HTML/atendimentos.html">Serviços</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../HTML/barbeiros.html">Barbeiros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../HTML/contatos.html">Contatos</a>
          </li>
        </ul>

        <div id="auth-container" class="ms-lg-auto">
            <button class="btnLogin-popup" onclick="window.location.href='login.html'">Login</button>
        </div>
      </div>
    </div>
  </nav>

  <br><br><br>

  <section>
    <h2>Agendamentos</h2>
    <form id="formulario">
  
      <label for="data">Data</label>
      <input type="date" name="data" id="data" required>
      <label for="cortes">Tipos de Cortes</label>
      <select name="cortes" class="form-select" id="cortes" required>
        <option value="" disabled selected>Carregando opções do banco...</option>
      </select>
  <br>
      <label for="barbeiro">Barbeiros</label>
      <select name="barbeiro" class="form-select" id="barbeiro" required>
        <option value="" disabled selected>Escolha seu barbeiro...</option>
      </select>
 <br>
      <label for="horarios">Horários</label>
      <select name="horarios" class="form-select" id="horarios" required>
        <option value="" disabled selected>Escolha seu Horário...</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
        <option value="18:00">18:00</option>
        <option value="19:00">19:00</option>
        <option value="20:00">20:00</option>
        <option value="21:00">21:00</option>
        <option value="22:00">22:00</option>
      </select>
      <br>
  
      <button type="submit" class="btn btn-primary mt-3" style="width: 100%;">Enviar Agendamento</button>
    </form>
  </section>

  <br><br><br>

  <footer style="text-align: center; padding: 20px; background-color: #3b3a3d; color: white;">
    <h3>&copy; Todos os direitos reservados</h3>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth.js"></script>
  <script src="../JS/agendamento.js"></script>
  
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
